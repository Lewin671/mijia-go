name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go mod verify
      - name: Build archives
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/package.sh "$RELEASE_VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" dist/*.tar.gz dist/*.zip dist/checksums.txt --verify-tag --prerelease --title "$RELEASE_VERSION — CLI + Skill preview" --notes-file CHANGELOG.md
